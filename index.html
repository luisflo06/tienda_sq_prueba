<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exótica | Store</title>
    <!-- Tailwind por CDN (solo para desarrollo; en producción usa el build de Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

    <!-- Navegación -->
    <nav class="p-6 bg-gray-800 bg-opacity-50 backdrop-blur-md border-b border-purple-500 shadow-[0_0_15px_rgba(168,85,247,0.4)]">
        <h1 class="text-4xl font-black text-center text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 tracking-widest">
            EXÓTICA STORE
        </h1>
    </nav>

    <!-- Buscador -->
    <form id="form-busqueda" class="container mx-auto mt-10 px-4 text-center">
        <label for="buscador" class="sr-only">Buscar productos</label>
        <input type="text" id="buscador" placeholder="Buscar productos..." maxlength="100"
               class="p-4 w-full max-w-md bg-gray-800 border border-pink-500 rounded-full focus:outline-none focus:ring-2 focus:ring-pink-400 shadow-[0_0_10px_rgba(236,72,153,0.3)]">
        <button type="submit"
                class="ml-4 p-4 bg-gradient-to-r from-purple-500 to-pink-600 rounded-full font-bold hover:scale-105 transition-transform">
            Buscar
        </button>
    </form>

    <!-- Catálogo -->
    <div class="container mx-auto mt-12 px-4">
        <p id="mensaje" class="text-center text-gray-400 mb-6" role="status"></p>
        <div id="catalogo" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api/productos";
        const catalogo = document.getElementById("catalogo");
        const mensaje = document.getElementById("mensaje");

        // Helper: crea un elemento con clases y texto (textContent evita XSS)
        function crearElemento(etiqueta, clases, texto) {
            const el = document.createElement(etiqueta);
            if (clases) el.className = clases;
            if (texto !== undefined) el.textContent = texto;
            return el;
        }

        function crearTarjeta(producto) {
            const tarjeta = crearElemento(
                "div",
                "bg-gray-800 rounded-2xl p-6 border border-gray-700 hover:border-purple-500 transition-all hover:shadow-[0_0_20px_rgba(168,85,247,0.5)] group"
            );

            const img = crearElemento("img", "w-32 h-32 mx-auto mb-4 object-contain group-hover:scale-110 transition-transform");
            img.src = producto.imagen;
            img.alt = producto.nombre;
            img.loading = "lazy";

            const nombre = crearElemento("h2", "text-xl font-bold text-center mb-2", producto.nombre);
            const precio = crearElemento(
                "p",
                "text-pink-400 text-2xl font-black text-center",
                "$" + Number(producto.precio).toLocaleString("es-CO")
            );
            const boton = crearElemento(
                "button",
                "w-full mt-6 py-2 bg-gray-700 hover:bg-purple-600 rounded-lg font-bold transition-colors",
                "Comprar"
            );
            boton.type = "button";

            tarjeta.append(img, nombre, precio, boton);
            return tarjeta;
        }

        async function cargarProductos() {
            const filtro = document.getElementById("buscador").value.trim();
            // encodeURIComponent evita romper/manipular la URL
            const url = `${API_URL}?busqueda=${encodeURIComponent(filtro)}`;

            try {
                const respuesta = await fetch(url);
                if (!respuesta.ok) {
                    throw new Error(`HTTP ${respuesta.status}`);
                }
                const data = await respuesta.json();

                catalogo.replaceChildren(...data.productos.map(crearTarjeta));

                if (filtro !== "") {
                    // textContent: el texto del usuario nunca se interpreta como HTML
                    mensaje.textContent = `Resultados de: ${filtro}`;
                } else {
                    mensaje.textContent = "";
                }
                if (data.productos.length === 0) {
                    mensaje.textContent = "No se encontraron productos.";
                }
            } catch (error) {
                console.error("Error cargando productos:", error);
                catalogo.replaceChildren();
                mensaje.textContent = "No pudimos cargar los productos. Intenta de nuevo.";
            }
        }

        document.getElementById("form-busqueda").addEventListener("submit", (e) => {
            e.preventDefault();
            cargarProductos();
        });

        // Carga inicial
        cargarProductos();
    </script>
</body>
</html>
