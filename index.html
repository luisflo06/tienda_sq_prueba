<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Exótica | Store</title>
    <!-- Tailwind por CDN para no matarse la cabeza -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

    <!-- Navegación -->
    <nav class="p-6 bg-gray-800 bg-opacity-50 backdrop-blur-md border-b border-purple-500 shadow-[0_0_15px_rgba(168,85,247,0.4)]">
        <h1 class="text-4xl font-black text-center text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 tracking-widest">
            EXÓTICA STORE
        </h1>
    </nav>

    <!-- Buscador -->
    <div class="container mx-auto mt-10 px-4 text-center">
        <input type="text" id="buscador" placeholder="Buscar productos..." 
               class="p-4 w-full max-w-md bg-gray-800 border border-pink-500 rounded-full focus:outline-none focus:ring-2 focus:ring-pink-400 shadow-[0_0_10px_rgba(236,72,153,0.3)]">
        <button onclick="cargarProductos()" 
                class="ml-4 p-4 bg-gradient-to-r from-purple-500 to-pink-600 rounded-full font-bold hover:scale-105 transition-transform">
            Buscar
        </button>
    </div>

    <!-- Catálogo -->
    <div class="container mx-auto mt-12 px-4">
        <div id="catalogo" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Los productos cargan aquí -->
        </div>
    </div>

    <script>
        var apiUrl = "http://127.0.0.1:8000/api/productos";

        function cargarProductos() {
            var filtro = document.getElementById("buscador").value;
            var url = apiUrl + "?busqueda=" + filtro;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    var html = "";
                    var catalogo = document.getElementById("catalogo");

                    // Vulnerabilidad: DOM-based XSS (inyectando directamente el input del buscador)
                    if(filtro !== "") {
                        document.getElementById("catalogo").innerHTML = "<p class='col-span-full text-center text-gray-400'>Resultados de: " + filtro + "</p>";
                    }

                    for(var i = 0; i < data.productos.length; i++) {
                        var p = data.productos[i];
                        html += `
                        <div class="bg-gray-800 rounded-2xl p-6 border border-gray-700 hover:border-purple-500 transition-all hover:shadow-[0_0_20px_rgba(168,85,247,0.5)] group">
                            <img src="${p.imagen}" class="w-32 h-32 mx-auto mb-4 object-contain group-hover:scale-110 transition-transform">
                            <h2 class="text-xl font-bold text-center mb-2">${p.nombre}</h2>
                            <p class="text-pink-400 text-2xl font-black text-center">$${p.precio.toLocaleString()}</p>
                            <button class="w-full mt-6 py-2 bg-gray-700 hover:bg-purple-600 rounded-lg font-bold transition-colors">Comprar</button>
                        </div>
                        `;
                    }
                    
                    // Si hubo filtro, sumamos al HTML existente para demostrar el XSS
                    if(filtro !== "") {
                        catalogo.innerHTML += html;
                    } else {
                        catalogo.innerHTML = html;
                    }
                });
        }

        // Carga inicial
        cargarProductos();
    </script>
</body>
</html>
